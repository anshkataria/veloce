services:
  db:
    image: postgres:16-alpine
    container_name: veloce-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veloce_db}
      POSTGRES_USER: ${POSTGRES_USER:-veloce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veloce123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veloce_user -d veloce_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: veloce-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/veloce_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-veloce_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-veloce123}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production-123456}
      JWT_EXPIRATION: 86400000
      REDIS_HOST: redis
      CACHE_TYPE: redis
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-orders@veloce.local}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:5173/orders?payment=success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:5173/checkout?payment=cancelled}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: veloce-redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: veloce-mailpit
    ports:
      - "8025:8025"

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    container_name: veloce-storefront
    depends_on:
      - backend
    ports:
      - "5173:80"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: veloce-admin
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  pgdata:
  redisdata:
